name: OKX Demo forward test

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type execute-demo-cycle to run one Demo cycle manually"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nebula-okx-demo-vm
  cancel-in-progress: false

jobs:
  forward-test:
    name: Run one Demo forward-test cycle
    runs-on: [self-hosted, nebula-vm]
    timeout-minutes: 10
    environment: okx-demo-execution
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.NEBULA_FORWARD_TEST_ENABLED == 'true' &&
      (github.event_name == 'schedule' || inputs.confirm == 'execute-demo-cycle')
    env:
      NEBULA_ENABLE_DEMO_ORDERS: 'true'
      NEBULA_KILL_SWITCH: 'false'
      NEBULA_DEMO_ACCOUNT_EXCLUSIVE: 'true'
      NEBULA_OKX_REGION: 'global'
      NEBULA_MAX_RISK_QUOTE: '175'
      NEBULA_MAX_DAILY_LOSS_QUOTE: '350'
      NEBULA_MAX_POSITION_QUOTE: '9000'
      NEBULA_MAX_DRAWDOWN_PCT: '0.05'
      NEBULA_AUTO_COPY_RESULT: 'false'
      NEBULA_DB_PATH: /home/nebularunner/nebula-forward-test/state.db
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install NEBULA
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock -r requirements-build.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .

      - name: Prepare persistent state directory
        run: |
          mkdir -p /home/nebularunner/nebula-forward-test
          chmod 700 /home/nebularunner/nebula-forward-test

      - name: Run one forward-test cycle
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        shell: bash
        run: |
          test -n "$OKX_API_KEY"
          test -n "$OKX_SECRET_KEY"
          test -n "$OKX_PASSPHRASE"
          nebula orchestrate-once --execute-demo

      - name: Back up forward-test state
        run: |
          mkdir -p /home/nebularunner/nebula-forward-test/backups
          nebula backup-state --db /home/nebularunner/nebula-forward-test/state.db --output /home/nebularunner/nebula-forward-test/backups/state-backup.db

      - name: Report cycle gaps
        run: nebula cycle-gaps --db /home/nebularunner/nebula-forward-test/state.db
