name: OKX Demo VM preflight

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type run-read-only-preflight to run the VM preflight"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nebula-okx-demo-vm
  cancel-in-progress: false

jobs:
  preflight:
    name: Run read-only VM preflight and shadow cycle
    runs-on: [self-hosted, nebula-vm]
    timeout-minutes: 20
    environment: okx-demo-execution
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'run-read-only-preflight'
    env:
      NEBULA_ENABLE_DEMO_ORDERS: 'false'
      NEBULA_KILL_SWITCH: 'true'
      NEBULA_DEMO_ACCOUNT_EXCLUSIVE: 'true'
      NEBULA_OKX_REGION: 'global'
      NEBULA_MAX_RISK_QUOTE: '175'
      NEBULA_MAX_DAILY_LOSS_QUOTE: '350'
      NEBULA_MAX_POSITION_QUOTE: '9000'
      NEBULA_MAX_DRAWDOWN_PCT: '0.05'
      NEBULA_AUTO_COPY_RESULT: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install NEBULA
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock -r requirements-build.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .

      - name: Prepare preflight state directory
        run: |
          mkdir -p /home/nebularunner/nebula-forward-test
          chmod 700 /home/nebularunner/nebula-forward-test

      - name: Check public OKX endpoints from the VM
        run: nebula check-demo-public

      - name: Run signed read-only preflight from the VM
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        shell: bash
        run: |
          test -n "$OKX_API_KEY"
          test -n "$OKX_SECRET_KEY"
          test -n "$OKX_PASSPHRASE"
          nebula preflight-once --plan-risk-quote 175 --plan-max-notional-quote 9000 --db /home/nebularunner/nebula-forward-test/preflight.db

      - name: Run one shadow cycle without credentials
        run: nebula orchestrate-once --db /home/nebularunner/nebula-forward-test/preflight.db
