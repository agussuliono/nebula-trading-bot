name: NEBULA CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebula-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'

      - name: Run test suite
        run: python -m pytest -q

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Verify explicit CI safety settings
        env:
          NEBULA_ENABLE_DEMO_ORDERS: 'false'
          NEBULA_KILL_SWITCH: 'true'
        run: |
          python -m nebula.cli --help
          python -c "from nebula.config import Settings; s=Settings.from_env(); assert s.enable_demo_orders is False; assert s.kill_switch is True"

      - name: Verify fail-closed defaults with variables unset
        run: |
          env -u NEBULA_ENABLE_DEMO_ORDERS -u NEBULA_KILL_SWITCH python -c "from nebula.config import Settings; s=Settings.from_env(); assert s.enable_demo_orders is False; assert s.kill_switch is True"
