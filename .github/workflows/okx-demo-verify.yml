name: OKX Demo read-only verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebula-okx-demo-readonly
  cancel-in-progress: false

jobs:
  verify:
    name: Verify OKX Demo account (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: okx-demo-readonly
    if: github.ref == 'refs/heads/main'
    env:
      NEBULA_ENABLE_DEMO_ORDERS: 'false'
      NEBULA_KILL_SWITCH: 'true'
      NEBULA_OKX_REGION: 'global'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install NEBULA
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run read-only Demo verification
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        shell: bash
        run: |
          test -n "$OKX_API_KEY"
          test -n "$OKX_SECRET_KEY"
          test -n "$OKX_PASSPHRASE"
          nebula verify-demo-once
